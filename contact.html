<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room 32 — 聯絡</title>
<meta name="description" content="聯絡 Room 32：合作提案、展覽邀請、交流。">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" type="image/png" href="assets/img/logo.png">
</head>
<body>
<header id="site-header"></header>

<main>
  <section class="hero container" style="padding-bottom:clamp(40px,6vh,72px);">
    <p class="eyebrow" data-zh="CONTACT / 聯絡" data-en="CONTACT"></p>
    <h1 class="title" style="font-size:clamp(40px,6.5vw,76px);" data-zh="讓 Room 32 到你的城市" data-en="Bring Room 32 to your city"></h1>
    <p class="hero-desc" data-zh="如果你希望 Room 32 踏足你所在的城市，或想合作展覽與活動，歡迎寫信。" data-en="If you would like Room 32 to visit your city, or would like to collaborate on an exhibition or event, please write to us."></p>
  </section>

  <section class="section container" style="padding-top:0;">
    <ul class="contact-list">
      <li>
        <span class="contact-label" data-zh="電子郵件 / EMAIL" data-en="EMAIL"></span>
        <a class="contact-value" href="mailto:room32hk@gmail.com">room32hk@gmail.com</a>
      </li>
      <li>
        <span class="contact-label">INSTAGRAM</span>
        <a class="contact-value" href="https://instagram.com/room32_hk" target="_blank" rel="noopener">@room32_hk</a>
      </li>
      <li>
        <span class="contact-label" data-zh="現時所在地 / CURRENTLY" data-en="CURRENTLY"></span>
        <span class="contact-value" data-zh="流動中 — 香港／岡山／長沙" data-en="In transit — Hong Kong / Okayama / Changsha"></span>
      </li>
    </ul>
  </section>
</main>

<footer id="site-footer"></footer>
<script src="assets/js/main.js"></script>
</body>
</html>
