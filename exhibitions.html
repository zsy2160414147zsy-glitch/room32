    <div class="archive-item has-poster">

      <a class="poster" href="assets/img/exhibitions/poster-2025-08-chunkan.jpg" target="_blank" rel="noopener">
        <img src="assets/img/exhibitions/poster-2025-08-chunkan.jpg" alt="純看：重讀一座陌生城市">
      </a>
      <div>
        <div class="archive-title" data-zh="純看：重讀一座陌生城市" data-en="Pure Looking: Reading an Unfamiliar City"></div>
        <div class="archive-meta">
          <span data-zh="2025.08" data-en="2025.08"></span>
          <span class="tag">首展</span>
          <span class="tag">實驗</span>
        </div>
        <div class="archive-desc" data-zh="「純看」是一種強有力的態度，剝離了說教，創造了一個讓觀者與物件直接對話的場域。地圖，是一種沉默的語言，我們邀請你，暫時擱置所有解說與導覽。這不僅是一場展覽，更是一場關於「如何觀看」的實驗。答案，始終在地圖與你之間。" data-en="'Pure Looking' is a powerful attitude — it strips away didacticism and creates a field where viewer and object speak directly. A map is a silent language; we invite you to set aside all interpretation and guided tours for a while. This is not only an exhibition but an experiment in 'how to look'. The answer lies, always, between the map and you."></div>
      </div>
    </div>

    <div class="archive-item has-poster">
      <div class="archive-no">002</div>
      <a class="poster" href="assets/img/exhibitions/poster-2026-01-waylay.jpg" target="_blank" rel="noopener">
        <img src="assets/img/exhibitions/poster-2026-01-waylay.jpg" alt="洄萊 Waylay">
      </a>
      <div>
        <div class="archive-title" data-zh="洄萊 Waylay" data-en="Hui Lai / Waylay"></div>
        <div class="archive-meta">
          <span data-zh="2026.01" data-en="2026.01"></span>
          <span class="tag">展覽</span>
          <span class="tag">工作坊</span>
        </div>
        <div class="archive-desc" data-zh="洄，是水的回旋往復——我們順著回旋的水流行進，尋找心靈地圖上的那個點：敞開手臂、無條件接納的旅程。萊，是「藜」，荒地裡的野草，充滿生機。本次展覽希望通過多維度敘事與互動工作坊，講述從物理空間到心靈的「回來」。作品媒介涵蓋所有藝術形式，包括且不限於繪畫、小型裝置、其他跨媒介作品、戲劇、工作坊與藝術共創活動。" data-en="Hui is the circular return of water — we travel along the swirling currents, searching for that point on the inner map: a journey of unconditional embrace with open arms. Lai is 'lamb's quarters', wild grass flourishing in the wasteland. Through multi-dimensional narratives and interactive workshops, this exhibition tells a story of 'coming home' — from physical space to the mind. Media includes all art forms: painting, small-scale installation, cross-media works, theatre, workshops, and collaborative art-making."></div>
      </div>
    </div>
