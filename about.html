<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room 32 — 關於</title>
<meta name="description" content="Room 32：以長沙老宅為據點、以流動形式生長的獨立空間。見所未見，始於凝視。">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" type="image/png" href="assets/img/logo.png">
</head>
<body>
<header id="site-header"></header>

<main>
  <section class="hero container">
    <p class="eyebrow" data-zh="ABOUT / 關於" data-en="ABOUT"></p>
    <h1 class="title" style="font-size:clamp(40px,6.5vw,76px);" data-zh="關於這個空間" data-en="About the space"></h1>
  </section>

  <section class="section container">
    <div class="prose">
      <p class="mono-note" data-zh="緣起 / THE BEGINNING" data-en="THE BEGINNING"></p>
      <p class="dropcap" data-zh="Room 32 是一個由香港學生在高中最後一個假期發起的獨立空間，正以流動展覽、活動及讀書會的形式在中國香港、中國內地和日本岡山生長。" data-en="Room 32 is an independent space founded by a Hong Kong student during the final holiday of high school — growing through nomadic exhibitions, events, and reading circles across Hong Kong (China), mainland China, and Okayama (Japan)."></p>
      <p data-zh="我們相信每一次凝視，都是一次未知的相遇。" data-en="We believe that every gaze is an encounter with the unknown."></p>
      <blockquote class="quote">
        <p class="slogan" data-zh="見所未見，始於凝視。" data-en="See the Unseen, Start with a Gaze."></p>
      </blockquote>
    </div>
  </section>

  <section class="section container">
    <div class="prose">
      <p class="mono-note" data-zh="為什麼叫 Room 32 / THE NAME" data-en="THE NAME"></p>
      <p data-zh="「三二」是空間主理人的名字，也是這個空間的名字。空間之所以以她命名，是因為 Room 32 首先是三二個人的輸出——一個表達自己想法、試驗創作的地方。" data-en="'San Er' is the name of the space's founder and the name of the space itself. It carries her name because Room 32 is first and foremost San Er's own output — a place to express her ideas and experiment with creation."></p>
      <p data-zh="作為創始人和主理人，她希望這裡的一切都由自己的想法出發：展覽由她策劃，文字由她書寫，空間由她搭建。" data-en="As founder and curator, she wants everything here to begin with her own thinking: exhibitions she curates, texts she writes, spaces she builds."></p>
    </div>
  </section>

  <section class="section container">
    <div class="section-head">
      <h2 class="section-title" data-zh="據點與流動" data-en="Base and movement"></h2>
    </div>
    <div class="prose">
      <p data-zh="長沙老宅是空間的據點，也是它的起點；而流動讓它持續生長。目前，Room 32 以流動展覽、活動及讀書會的形式活躍於中國香港、中國內地和日本岡山之間——每一站的地點、場域與相遇的人，都會成為這個空間的一部分。" data-en="The old house in Changsha is the space's base and its starting point; movement is what keeps it growing. For now, Room 32 is active across Hong Kong (China), mainland China, and Okayama (Japan) through nomadic exhibitions, events, and reading circles — each venue, site, and the people met along the way become part of the space."></p>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

</body>
</html>
